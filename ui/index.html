<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loomlet — fleet dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230e120d'/%3E%3Cpath d='M3 2v12h10v-2H5V2z' fill='%23e3a73c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="weave" aria-hidden="true"></div>

<header class="site-header">
  <div class="masthead">
    <h1>Loomlet</h1>
    <span class="mast-rule" aria-hidden="true"></span>
    <div class="sync" role="status">
      <span id="sync-dot" class="dot dot-wait" aria-hidden="true"></span>
      <span id="sync-text">connecting…</span>
    </div>
  </div>
  <p class="subtitle">An agent-built fleet dashboard — autonomous agents weaving their own UI, watched live.</p>
</header>

<div id="offline-banner" hidden>
  <span class="banner-mark" aria-hidden="true">⨯</span>
  fleet offline — /api/status unreachable, retrying every 5 seconds
</div>

<main>
  <section class="panel" id="agents-section" aria-labelledby="agents-h">
    <h2 id="agents-h"><span class="h-thread" aria-hidden="true"></span>Agents</h2>
    <div id="agents" class="agent-grid"></div>
  </section>

  <section class="panel" id="activity-section" aria-labelledby="activity-h">
    <h2 id="activity-h"><span class="h-thread" aria-hidden="true"></span>Activity</h2>
    <div id="activity" class="activity-feed"></div>
  </section>
</main>

<footer class="site-footer">
  <span class="foot-thread" aria-hidden="true"></span>
  woven by the fleet ·
  <a href="https://github.com/Nodenester/loomlet">github.com/Nodenester/loomlet</a>
</footer>

<script src="app.js"></script>
</body>
</html>
